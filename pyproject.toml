[project]
name = "simulated-trading-control-plane"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audit = ["pandas==2.3.3", "pyarrow==22.0.0"]
ctrader = ["websocket-client==1.8.0"]
test = ["pytest==8.3.5", "websocket-client==1.8.0", "pandas==2.3.3", "pyarrow==22.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
